name: CI

on:
    # Roda em qualquer branch, e não só na main. Sem isto, um push em branch de
    # trabalho não acionava a CI, e o time só descobria a quebra ao abrir o pull
    # request. Foi assim que a matriz de Node quebrada chegou até a main.
    push:
        branches: ['**']
    pull_request:

# Cancela execuções antigas do mesmo branch quando um push novo chega.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Conferir formatação
              run: npm run format:check

            # Os testes criam o próprio banco temporário a partir de db/schema.sql e
            # db/seed.sql, portanto não precisam do npm run db:setup. Este passo confere
            # que o script de criação funciona em uma máquina limpa.
            - name: Criar o banco
              run: npm run db:setup

            - name: Testes
              run: npm test

            - name: Smoke test do servidor de verdade
              run: |
                  set -euo pipefail

                  # O trap garante que o servidor morre mesmo quando uma asserção falha.
                  # Sem ele, o runner encerrava com "Terminate orphan process: npm start".
                  node server.js & SERVIDOR=$!
                  trap 'kill "$SERVIDOR" 2>/dev/null || true' EXIT

                  for i in $(seq 1 30); do
                    if curl -sf http://localhost:3000/health > /dev/null; then break; fi
                    sleep 1
                  done

                  curl -sf http://localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'

                  # A busca sem 'tipo' precisa responder 400, e o servidor continuar no ar.
                  # Antes da correção do item P0-1, este pedido matava o processo.
                  test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/produtos/buscar?termo=41')" = "400"

                  # O POST sem corpo válido precisa responder 400.
                  test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/produtos \
                    -H 'Content-Type: application/json' -d '{}')" = "400"

                  # O processo tem de estar vivo depois de tudo.
                  curl -sf http://localhost:3000/health > /dev/null

    frontend:
        name: Frontend (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: painel-estoque
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: painel-estoque/package-lock.json

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Testes
              run: npm test

            - name: Build
              run: npm run build
